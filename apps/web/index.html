<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LesGoMeet — Meet without the noise</title>
  <link rel="stylesheet" href="style-showcase.css">
</head>
<body><main class="shell"><header><a class="brand" href="/">Les<span>Go</span>Meet</a><span id="status">Ready to join</span></header><section id="lobby" class="lobby"><div class="intro"><p class="eyebrow">MEET BETTER, TOGETHER</p><h1>Big ideas deserve a better room.</h1><p>A focused space for the people and conversations that move work forward.</p><div class="feature-row"><span>◉ HD video</span><span>⌁ Private rooms</span><span>↗ Screen share</span></div></div><form id="join-form" class="join-card"><h2>Join the room</h2><label>Your name<input id="name" maxlength="32" placeholder="e.g. Priya Sharma" required autofocus></label><label>Meeting code<input id="room" maxlength="64" placeholder="e.g. design-sync" required></label><div class="device"><label>Camera<select id="camera"><option value="">Default camera</option></select></label><label>Microphone<select id="microphone"><option value="">Default microphone</option></select></label></div><button type="submit">Join now <span>→</span></button><p>No account required. Your meeting link is private.</p></form></section><section id="call" class="call hidden"><div class="call-heading"><div><p class="eyebrow">IN A MEETING <span class="live-dot">LIVE</span></p><h2 id="room-title"></h2></div><button id="copy-link" class="quiet">Copy joining info</button></div><section id="video-grid" aria-label="Meeting participants"></section><aside id="sidepanel" class="sidepanel hidden"><div class="tabs"><button data-panel="open">People <b id="participant-count">1</b></button><button data-panel="open">Chat</button></div><ul id="participant-list"></ul><div id="messages"></div><form id="chat-form"><input id="chat-input" placeholder="Send a message" maxlength="500"><button>↑</button></form></aside><div id="reactions" class="reactions"><button>👏</button><button>❤️</button><button>😂</button><button>🎉</button></div><footer id="controls"><button class="control" id="btn-mute">🎙<span>Mute</span></button><button class="control" id="btn-cam">◉<span>Camera</span></button><button class="control" id="btn-share">▣<span>Present</span></button><button class="control" id="btn-hand">✋<span>Raise hand</span></button><button class="control" data-panel="open">☷<span>People & chat</span></button><button class="control danger" id="btn-leave">☎<span>Leave</span></button></footer></section></main><script type="module" src="app-showcase.js"></script>
</body>
</html>
